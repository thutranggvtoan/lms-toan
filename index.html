<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LMS Toán</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root{
  --bg:#f5f7fb; --card:#ffffff; --text:#14213d; --muted:#586174; --line:#e2e7ef;
  --primary:#2557d6; --primary-ink:#ffffff; --primary-soft:#e8efff;
  --danger:#b3261e; --danger-soft:#fdecea; --ok:#17744a; --ok-soft:#e6f5ec;
  --shadow:0 1px 2px rgba(20,33,61,.06),0 4px 16px rgba(20,33,61,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1524; --card:#162038; --text:#e8edf7; --muted:#a3adc2; --line:#27324d;
    --primary:#6b95ff; --primary-ink:#0b1630; --primary-soft:#1f2d52;
    --danger:#ff8a80; --danger-soft:#3a1c1c; --ok:#6fd6a0; --ok-soft:#173326;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Be Vietnam Pro',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.55;color:var(--text);background:var(--bg)}
h1{font-size:24px;line-height:1.25;margin:0 0 4px}
h2{font-size:18px;margin:0 0 12px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
a{color:var(--primary)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:6px}

/* Nút */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border:1px solid var(--primary);background:var(--primary);color:var(--primary-ink);border-radius:10px;font-weight:600;text-decoration:none;min-height:42px}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--primary)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:14px}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline}
.link.danger{color:var(--danger)}

/* Form */
label{display:block;font-weight:500;margin-bottom:14px}
input,select,textarea{display:block;width:100%;margin-top:6px;padding:10px 12px;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:42px}
textarea{min-height:110px;resize:vertical}
.err{color:var(--danger);background:var(--danger-soft);padding:8px 12px;border-radius:8px;margin:0 0 12px}
.err:empty{display:none}

/* Khung chính */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--card);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:0 8px}
.logo{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--primary);color:var(--primary-ink);font-size:20px;font-weight:700}
.side nav{display:flex;flex-direction:column;gap:4px}
.side nav a,.bottom a{padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:500}
.side nav a:hover{background:var(--primary-soft)}
.side nav a.on,.bottom a.on{background:var(--primary-soft);color:var(--primary);font-weight:700}
.who{margin-top:auto;padding:0 8px;font-size:14px}
.who b{display:block;word-break:break-word}
.main{padding:28px 32px 48px;max-width:1040px;width:100%}
.top,.bottom{display:none}

/* Thẻ, bảng */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
.stat b{display:block;font-size:30px;line-height:1.1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
a.card.link-card{text-decoration:none;color:inherit;display:block}
a.card.link-card:hover{border-color:var(--primary)}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--primary-soft);color:var(--primary);font-size:13px;font-weight:600}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
td.bad{color:var(--danger)}
td.good{color:var(--ok)}
.empty{text-align:center;padding:36px 16px}
.empty h2{margin-bottom:6px}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.steps li{display:flex;gap:12px;align-items:flex-start}
.dot{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700}
.dot.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.code{font-family:ui-monospace,Consolas,monospace;font-weight:700;letter-spacing:.06em}

/* Hộp thoại */
.overlay{position:fixed;inset:0;background:rgba(10,18,36,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--card);border-radius:16px;padding:24px;width:100%;max-width:640px;max-height:92vh;overflow:auto}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.note{background:var(--primary-soft);padding:10px 14px;border-radius:10px;margin-bottom:14px}
.note.warn{background:var(--danger-soft);color:var(--danger)}

/* Đăng nhập */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .card{width:100%;max-width:400px;padding:28px}
.login .brand{padding:0;margin-bottom:18px}
.center{min-height:60vh;display:grid;place-items:center;color:var(--muted)}

[hidden]{display:none!important}
input[type=radio],input[type=checkbox]{display:inline-block;width:auto;min-height:0;margin:3px 0 0;flex:none}
label.opt{display:flex;align-items:flex-start;gap:10px;font-weight:400;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;margin-bottom:8px}
label.opt:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.video{position:relative;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
.video iframe,.video #yt{position:absolute;inset:0;width:100%;height:100%}
.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:12px 0}
.qcard{border:2px solid var(--primary);margin:12px 0}
.mathy{white-space:pre-wrap}
.fb{padding:10px 14px;border-radius:10px;margin:12px 0;font-weight:600}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--danger-soft);color:var(--danger)}
.pdf{margin-top:12px;height:70vh;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pdf iframe{width:100%;height:100%;border:0;margin:0;min-height:0}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.tfrow{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;margin-bottom:10px}
.tfopts{display:flex;gap:8px}
.tfopts label.opt{margin:0;padding:6px 12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qitem{padding:14px 0;border-bottom:1px solid var(--line)}
.qitem:last-child{border-bottom:0}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .top .brand{padding:0}
  .main{padding:20px 16px 96px}
  .bottom{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);z-index:5}
  .bottom a{text-align:center}
}
</style>
</head>
<body>
<div id="app"><div class="center">Đang tải…</div></div>

<script>
/* =====================================================
   CẤU HÌNH — chỉ cần sửa dòng SUPABASE_KEY
   ===================================================== */
const SUPABASE_URL = 'https://nxmhiqzkuusegcvznwlp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_A_4F41fsal2uJPXrJjtVNA_kfTlkG-g';   // bắt đầu bằng sb_publishable_...
const STUDENT_EMAIL_DOMAIN = 'hs.lms-toan.vn';           // đuôi email ảo cho học sinh (học sinh không thấy)

/* =====================================================
   TIỆN ÍCH
   ===================================================== */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const noTone = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D');
const slug = s => noTone(s).toLowerCase().replace(/[^a-z0-9._-]/g, '');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const lastWord = n => String(n).trim().split(/\s+/).pop();

function viErr(m) {
  m = String(m || '');
  if (/already registered|already been registered/i.test(m)) return 'Tên đăng nhập đã tồn tại';
  if (/rate limit|too many/i.test(m)) return 'Gửi quá nhanh, hãy thử lại sau vài phút';
  if (/invalid login/i.test(m)) return 'Sai tên đăng nhập hoặc mật khẩu';
  if (/email.*invalid|invalid.*email/i.test(m)) return 'Hệ thống từ chối email tự tạo (xem STUDENT_EMAIL_DOMAIN)';
  if (/database error/i.test(m)) return 'Lỗi lưu hồ sơ (tên đăng nhập có thể đã tồn tại)';
  if (/password/i.test(m)) return 'Mật khẩu không hợp lệ (cần từ 6 ký tự)';
  return m;
}

function modal(html) {
  const el = document.createElement('div');
  el.className = 'overlay';
  el.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(el);
  const close = () => el.remove();
  el.addEventListener('mousedown', e => { if (e.target === el) close(); });
  $$('[data-close]', el).forEach(b => b.addEventListener('click', close));
  const first = $('input,select,textarea', el); if (first) first.focus();
  return { el, close };
}

/* =====================================================
   KHỞI TẠO
   ===================================================== */
let sb = null;
let me = null;
let teardown = null;   // dọn dẹp khi rời trang (dừng video, hẹn giờ)

if (!window.supabase) {
  app.innerHTML = '<div class="center">Không tải được thư viện Supabase. Kiểm tra kết nối mạng.</div>';
} else if (SUPABASE_KEY.includes('DÁN')) {
  app.innerHTML = `<div class="login"><div class="card"><h2>Chưa cấu hình</h2>
    <p>Mở file <b>index.html</b>, tìm dòng <code>SUPABASE_KEY</code> và dán khóa <b>publishable</b> của bạn vào.</p></div></div>`;
} else {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  boot();
}

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return renderLogin();
  await loadProfile(session.user);
}

async function loadProfile(user) {
  const { data, error } = await sb.from('profiles').select('*').eq('id', user.id).single();
  if (error || !data) {
    await sb.auth.signOut();
    return renderLogin('Không tìm thấy hồ sơ tài khoản. Hãy báo giáo viên.');
  }
  me = data;
  window.addEventListener('hashchange', route);
  route();
}

async function logout() {
  await sb.auth.signOut();
  me = null;
  location.hash = '';
  renderLogin();
}

/* =====================================================
   ĐĂNG NHẬP
   ===================================================== */
function renderLogin(msg = '') {
  app.innerHTML = `
  <div class="login"><div class="card">
    <div class="brand"><span class="logo">π</span> LMS Toán</div>
    <h1>Đăng nhập</h1>
    <p class="muted small">Học sinh nhập tên đăng nhập giáo viên đã cấp. Giáo viên nhập email.</p>
    <form id="f">
      <label>Tên đăng nhập hoặc email
        <input name="id" autocomplete="username" autocapitalize="none" required></label>
      <label>Mật khẩu
        <input name="pw" type="password" autocomplete="current-password" required></label>
      <p class="err" id="e">${esc(msg)}</p>
      <button class="btn" style="width:100%" id="go">Đăng nhập</button>
    </form>
  </div></div>`;
  $('#f').addEventListener('submit', async ev => {
    ev.preventDefault();
    const f = new FormData(ev.target);
    let id = String(f.get('id')).trim();
    const email = id.includes('@') ? id : slug(id) + '@' + STUDENT_EMAIL_DOMAIN;
    $('#go').disabled = true; $('#e').textContent = '';
    const { data, error } = await sb.auth.signInWithPassword({ email, password: String(f.get('pw')) });
    if (error) { $('#e').textContent = viErr(error.message); $('#go').disabled = false; return; }
    await loadProfile(data.user);
  });
}

/* =====================================================
   KHUNG TRANG
   ===================================================== */
function shell(active, inner) {
  const teacher = me.role === 'teacher';
  const items = teacher
    ? [['home', '#/', 'Trang chủ'], ['classes', '#/classes', 'Lớp học'], ['lessons', '#/lessons', 'Bài học']]
    : [['home', '#/', 'Lớp của tôi']];
  const links = items.map(([k, h, t]) => `<a href="${h}" class="${active === k ? 'on' : ''}">${t}</a>`).join('');
  app.innerHTML = `
  <div class="shell">
    <aside class="side">
      <div class="brand"><span class="logo">π</span> LMS Toán</div>
      <nav>${links}</nav>
      <div class="who"><b>${esc(me.full_name)}</b>
        <span class="muted small">${teacher ? 'Giáo viên' : 'Học sinh'}</span><br>
        <button class="link small js-logout">Đăng xuất</button></div>
    </aside>
    <div>
      <div class="top"><div class="brand"><span class="logo">π</span> LMS Toán</div>
        <button class="link small js-logout">Đăng xuất</button></div>
      <main class="main">${inner}</main>
    </div>
    <nav class="bottom">${links}</nav>
  </div>`;
  $$('.js-logout').forEach(b => b.addEventListener('click', logout));
}
const loading = () => '<div class="center">Đang tải…</div>';

/* =====================================================
   ĐỊNH TUYẾN
   ===================================================== */
function route() {
  if (!me) return;
  if (teardown) { try { teardown(); } catch (e) {} teardown = null; }
  const h = location.hash || '#/';
  let m;
  if (me.role !== 'teacher') {
    if ((m = h.match(/^#\/learn\/([0-9a-f-]{36})\/([0-9a-f-]{36})$/))) return learnPage(m[1], m[2]);
    return studentHome();
  }
  if (h === '#/' || h === '#') return teacherHome();
  if (h === '#/classes') return classList();
  if ((m = h.match(/^#\/class\/([0-9a-f-]{36})$/))) return classPage(m[1]);
  if (h === '#/lessons') return lessonList();
  if ((m = h.match(/^#\/lesson\/([0-9a-f-]{36})$/))) return lessonEditor(m[1]);
  teacherHome();
}

/* =====================================================
   GIÁO VIÊN: TRANG CHỦ
   ===================================================== */
async function teacherHome() {
  shell('home', loading());
  const [c, s, l, a] = await Promise.all([
    sb.from('classes').select('id', { count: 'exact', head: true }),
    sb.from('enrollments').select('student_id', { count: 'exact', head: true }),
    sb.from('lessons').select('id', { count: 'exact', head: true }),
    sb.from('class_lessons').select('id', { count: 'exact', head: true })
  ]);
  const nClass = c.count || 0, nStu = s.count || 0, nLes = l.count || 0, nAsg = a.count || 0;
  const done = ok => `<span class="dot ${ok ? 'done' : ''}">${ok ? '✓' : ''}</span>`;
  $('.main').innerHTML = `
    <div class="head">
      <div><h1>Xin chào, ${esc(me.full_name)}</h1><p class="muted">Việc cần làm để lớp học sẵn sàng.</p></div>
      <button class="btn" id="newClass">Tạo lớp mới</button>
    </div>
    <div class="stats">
      <div class="card stat"><span class="muted small">Lớp học</span><b>${nClass}</b></div>
      <div class="card stat"><span class="muted small">Học sinh</span><b>${nStu}</b></div>
      <div class="card stat"><span class="muted small">Bài học</span><b>${nLes}</b></div>
    </div>
    <div class="card">
      <h2>Bắt đầu</h2>
      <ul class="steps">
        <li>${done(nClass > 0)}<div><b>Tạo lớp học</b><div class="muted small">Đặt tên lớp và khối.</div></div></li>
        <li>${done(nStu > 0)}<div><b>Thêm học sinh</b><div class="muted small">Dán danh sách hoặc tải file Excel, hệ thống tự tạo tên đăng nhập và mật khẩu.</div></div></li>
        <li>${done(nLes > 0)}<div><b><a href="#/lessons">Tạo bài học có video và câu hỏi</a></b><div class="muted small">Gắn video YouTube, PDF và câu hỏi hiện đúng giây.</div></div></li>
        <li>${done(nAsg > 0)}<div><b>Giao bài cho lớp</b><div class="muted small">Vào lớp học, bấm "Giao bài".</div></div></li>
      </ul>
    </div>`;
  $('#newClass').addEventListener('click', newClassModal);
}

/* =====================================================
   GIÁO VIÊN: DANH SÁCH LỚP
   ===================================================== */
async function classList() {
  shell('classes', loading());
  const { data, error } = await sb.from('classes').select('*, enrollments(count)').order('created_at', { ascending: false });
  if (error) { $('.main').innerHTML = `<p class="err">${esc(viErr(error.message))}</p>`; return; }
  const body = data.length
    ? `<div class="grid">${data.map(c => `
        <a class="card link-card" href="#/class/${c.id}">
          <span class="tag">Khối ${esc(c.grade ?? '?')}</span>
          <h2 style="margin-top:10px">${esc(c.name)}</h2>
          <span class="muted small">${c.enrollments?.[0]?.count ?? 0} học sinh</span>
        </a>`).join('')}</div>`
    : `<div class="card empty"><h2>Chưa có lớp nào</h2>
        <p class="muted">Tạo lớp đầu tiên rồi thêm học sinh vào.</p>
        <button class="btn" id="newClass2">Tạo lớp đầu tiên</button></div>`;
  $('.main').innerHTML = `
    <div class="head"><div><h1>Lớp học</h1></div>
      ${data.length ? '<button class="btn" id="newClass">Tạo lớp mới</button>' : ''}</div>${body}`;
  $('#newClass')?.addEventListener('click', newClassModal);
  $('#newClass2')?.addEventListener('click', newClassModal);
}

function newClassModal() {
  const m = modal(`
    <h2>Tạo lớp mới</h2>
    <form id="f">
      <label>Tên lớp<input name="name" required placeholder="Ví dụ: Lớp 6A1"></label>
      <label>Khối<select name="grade">${[6,7,8,9,10,11,12].map(g => `<option>${g}</option>`).join('')}</select></label>
      <p class="err" id="e"></p>
      <div class="actions"><button type="button" class="btn ghost" data-close>Hủy</button><button class="btn" id="go">Tạo lớp</button></div>
    </form>`);
  $('#f', m.el).addEventListener('submit', async ev => {
    ev.preventDefault();
    const f = new FormData(ev.target);
    $('#go', m.el).disabled = true;
    const { data, error } = await sb.from('classes')
      .insert({ teacher_id: me.id, name: String(f.get('name')).trim(), grade: +f.get('grade') })
      .select().single();
    if (error) { $('#e', m.el).textContent = viErr(error.message); $('#go', m.el).disabled = false; return; }
    m.close();
    location.hash = '#/class/' + data.id;
  });
}

/* =====================================================
   GIÁO VIÊN: CHI TIẾT LỚP
   ===================================================== */
async function classPage(id) {
  shell('classes', loading());
  const { data: cls, error } = await sb.from('classes').select('*').eq('id', id).single();

function parseText(text) {
  return text.split(/\r?\n/).map(l => l.split(/\t|;/).map(c => c.trim())).filter(r => r.some(Boolean));
}
function dropHeader(arrs) {
  if (!arrs.length) return arrs;
  const c = noTone(String(arrs[0][0] ?? '')).toLowerCase();
  return /^(ho va ten|ho ten|ho & ten|ten hoc sinh|stt)/.test(c) ? arrs.slice(1) : arrs;
}
function buildRows(arrs, prefix) {
  const used = new Set(); let n = 0;
  return arrs.map(a => {
    const name = String(a[0] ?? '').trim();
    if (!name) return null;
    n++;
    const user = slug(a[1]) || (slug(prefix) + String(n).padStart(2, '0'));
    const pass = String(a[2] ?? '').trim() || String(Math.floor(100000 + Math.random() * 900000));
    let err = '';
    if (used.has(user)) err = 'Trùng tên đăng nhập trong danh sách';
    else if (pass.length < 6) err = 'Mật khẩu dưới 6 ký tự';
    used.add(user);
    return { name, user, pass, err };
  }).filter(Boolean);
}

function importModal(cls, onDone) {
  let arrs = [], rows = [];
  const m = modal(`
    <h2>Thêm học sinh vào ${esc(cls.name)}</h2>
    <div id="step1">
      <div class="note small">Mỗi dòng một học sinh. Cột 1: <b>Họ và tên</b> (bắt buộc). Cột 2: tên đăng nhập, cột 3: mật khẩu (để trống thì hệ thống tự tạo).</div>
      <label>Dán danh sách (copy từ Excel hoặc gõ mỗi dòng một tên)
        <textarea id="paste" placeholder="Nguyễn Văn An&#10;Trần Thị Bình"></textarea></label>
      <label>Hoặc chọn file Excel / CSV
        <input type="file" id="file" accept=".xlsx,.xls,.csv"></label>
      <p class="small"><button type="button" class="link" id="tpl">Tải file Excel mẫu</button></p>
      <label>Tiền tố tên đăng nhập (dùng khi để trống cột 2)
        <input id="prefix" value="${esc(slug(cls.name).replace(/^lop/, ''))}"></label>
      <p class="err" id="e"></p>
      <div class="actions"><button type="button" class="btn ghost" data-close>Hủy</button>
        <button type="button" class="btn" id="prev">Xem trước</button></div>
    </div>
    <div id="step2" hidden></div>`);
  const el = m.el;

  $('#tpl', el).addEventListener('click', () => {
    const ws = XLSX.utils.aoa_to_sheet([['Họ và tên', 'Tên đăng nhập (tùy chọn)', 'Mật khẩu (tùy chọn)'], ['Nguyễn Văn An', '', ''], ['Trần Thị Bình', '', '']]);
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Học sinh');
    XLSX.writeFile(wb, 'mau-danh-sach-hoc-sinh.xlsx');
  });

  $('#file', el).addEventListener('change', async ev => {
    const f = ev.target.files[0]; if (!f) return;
    try {
      const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
      arrs = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
      $('#paste', el).value = '';
      $('#e', el).textContent = '';
    } catch (e) { $('#e', el).textContent = 'Không đọc được file này.'; }
  });

  $('#prev', el).addEventListener('click', () => {
    const t = $('#paste', el).value.trim();
    if (t) arrs = parseText(t);
    arrs = dropHeader(arrs.filter(r => r.some(c => String(c).trim())));
    rows = buildRows(arrs, $('#prefix', el).value);
    if (!rows.length) { $('#e', el).textContent = 'Chưa có học sinh nào. Hãy dán danh sách hoặc chọn file.'; return; }
    showPreview();
  });

  function showPreview() {
    $('#step1', el).hidden = true;
    const s2 = $('#step2', el); s2.hidden = false;
    const bad = rows.filter(r => r.err).length;
    s2.innerHTML = `
      <p>Sẽ tạo <b>${rows.length - bad}</b> tài khoản${bad ? `, <b class="bad">${bad}</b> dòng lỗi sẽ bị bỏ qua` : ''}.</p>
      <div class="tablewrap" style="max-height:340px;overflow:auto"><table>
        <thead><tr><th>Họ và tên</th><th>Tên đăng nhập</th><th>Mật khẩu</th><th></th></tr></thead>
        <tbody>${rows.map(r => `<tr><td>${esc(r.name)}</td><td class="code">${esc(r.user)}</td><td class="code">${esc(r.pass)}</td><td class="bad">${esc(r.err)}</td></tr>`).join('')}</tbody></table></div>
      <div class="actions"><button type="button" class="btn ghost" id="back">Quay lại</button>
        <button type="button" class="btn" id="run" ${rows.length - bad ? '' : 'disabled'}>Tạo ${rows.length - bad} tài khoản</button></div>`;
    $('#back', el).addEventListener('click', () => { s2.hidden = true; $('#step1', el).hidden = false; });
    $('#run', el).addEventListener('click', run);
  }

  async function run() {
    const todo = rows.filter(r => !r.err);
    const s2 = $('#step2', el);
    s2.innerHTML = `<p id="prog">Đang tạo tài khoản… 0/${todo.length}</p><p class="muted small">Đừng đóng cửa sổ này.</p>`;
    // Client riêng, không lưu phiên: tạo tài khoản học sinh mà giáo viên không bị đăng xuất
    const tmp = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY,
      { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: 'sb-tmp-signup' } });
    const result = [];
    for (let i = 0; i < todo.length; i++) {
      const r = todo[i];
      const email = r.user + '@' + STUDENT_EMAIL_DOMAIN;
      const attempt = () => tmp.auth.signUp({ email, password: r.pass, options: { data: { full_name: r.name, username: r.user } } });
      let { data, error } = await attempt();
      if (error && /rate limit|too many/i.test(error.message)) {
        $('#prog', el).textContent = 'Hệ thống giới hạn tốc độ, chờ 30 giây rồi tiếp tục…';
        await sleep(30000);
        ({ data, error } = await attempt());
      }
      let status = 'Đã tạo';
      if (error || !data?.user) status = viErr(error?.message || 'Không tạo được');
      else {
        const e2 = (await sb.from('enrollments').insert({ class_id: cls.id, student_id: data.user.id })).error;
        if (e2) status = 'Tạo tài khoản được nhưng chưa vào lớp: ' + viErr(e2.message);
      }
      result.push({ ...r, status });
      const p = $('#prog', el); if (p) p.textContent = `Đang tạo tài khoản… ${i + 1}/${todo.length}`;
      await sleep(350);
    }
    const ok = result.filter(r => r.status === 'Đã tạo').length;
    s2.innerHTML = `
      <div class="note warn"><b>Tải file tài khoản ngay.</b> Mật khẩu không xem lại được sau khi đóng cửa sổ này.</div>
      <p>Đã tạo <b>${ok}/${result.length}</b> tài khoản.</p>
      <div class="tablewrap" style="max-height:300px;overflow:auto"><table>
        <thead><tr><th>Họ và tên</th><th>Tên đăng nhập</th><th>Mật khẩu</th><th>Kết quả</th></tr></thead>
        <tbody>${result.map(r => `<tr><td>${esc(r.name)}</td><td class="code">${esc(r.user)}</td><td class="code">${esc(r.pass)}</td>
          <td class="${r.status === 'Đã tạo' ? 'good' : 'bad'}">${esc(r.status)}</td></tr>`).join('')}</tbody></table></div>
      <div class="actions"><button class="btn ghost" id="dl">Tải file Excel tài khoản</button><button class="btn" id="fin">Xong</button></div>`;
    $('#dl', el).addEventListener('click', () => {
      const ws = XLSX.utils.aoa_to_sheet([['Họ và tên', 'Tên đăng nhập', 'Mật khẩu', 'Kết quả'], ...result.map(r => [r.name, r.user, r.pass, r.status])]);
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Tài khoản');
      XLSX.writeFile(wb, 'tai-khoan-' + (slug(cls.name) || 'lop') + '.xlsx');
    });
    $('#fin', el).addEventListener('click', () => { m.close(); onDone(); });
  }
}

/* =====================================================
   BÀI HỌC — TIỆN ÍCH
   ===================================================== */
const ytId = s => {
  s = String(s || '').trim(); if (!s) return '';
  const m = s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
  if (m) return m[1];
  return /^[A-Za-z0-9_-]{11}$/.test(s) ? s : '';
};
const safeUrl = u => /^https?:\/\//i.test(String(u || '').trim()) ? String(u).trim() : '';
const pdfEmbed = u => {
  u = safeUrl(u);
  const m = u.match(/drive\.google\.com\/file\/d\/([^/?#]+)/);
  return m ? `https://drive.google.com/file/d/${m[1]}/preview` : u;
};
const fmtT = s => { s = Math.max(0, Math.round(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const parseT = v => {
  v = String(v).trim();
  if (/^\d+$/.test(v)) return +v;
  const m = v.match(/^(\d+):(\d{1,2})$/);
  return m ? (+m[1]) * 60 + (+m[2]) : null;
};
const fmtDT = d => d ? new Date(d).toLocaleString('vi-VN', { dateStyle: 'short', timeStyle: 'short' }) : '';
const TYPE_NAME = { mcq: 'Trắc nghiệm', true_false: 'Đúng/Sai', short: 'Trả lời ngắn' };

function math(el) {
  if (!window.renderMathInElement || !el) return;
  try { renderMathInElement(el, { delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }], throwOnError: false }); } catch (e) {}
}

let ytReady = null;
function loadYT() {
  if (ytReady) return ytReady;
  ytReady = new Promise(res => {
    if (window.YT && window.YT.Player) return res();
    window.onYouTubeIframeAPIReady = () => res();
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  });
  return ytReady;
}
function makePlayer(elId, vid, onState) {
  return loadYT().then(() => new Promise(res => {
    const p = new YT.Player(elId, {
      videoId: vid, width: '100%', height: '100%',
      playerVars: { rel: 0, modestbranding: 1, playsinline: 1 },
      events: { onReady: () => res(p), onStateChange: e => onState && onState(e.data) }
    });
  }));
}

let edPlayer = null;

function answerText(q, k) {
  if (q.type === 'mcq') { const i = 'ABCD'.indexOf(k); return k + (i >= 0 && q.options ? '. ' + q.options[i] : ''); }
  if (q.type === 'true_false') {
    if (Array.isArray(q.options)) return 'abcd'.split('').map(c => c + ': ' + (k && k[c] ? 'Đúng' : 'Sai')).join('  ·  ');
    return k === true ? 'Đúng' : 'Sai';
  }
  return Array.isArray(k) ? k.join(' | ') : String(k ?? '');
}

        <label>Mô tả ngắn<textarea name="desc">${esc(les.description || '')}</textarea></label>

            : '<p class="muted">Dán link YouTube ở trên rồi bấm Lưu để xem video tại đây.</p>'}

function questionModal(les, q, key, nextPos, onDone) {
  const edit = !!q;
  const nowSec = edPlayer && edPlayer.getCurrentTime ? Math.round(edPlayer.getCurrentTime()) : 0;
  q = q || { type: 'mcq', content: '', options: null, show_at_second: nowSec, points: 1, explanation: '' };
  const m = modal(`
    <h2>${edit ? 'Sửa' : 'Thêm'} câu hỏi</h2>
    <form id="f">
      <label>Dạng câu hỏi
        <select id="type"><option value="mcq">Trắc nghiệm 4 đáp án</option><option value="true_false">Đúng / Sai</option><option value="short">Trả lời ngắn</option></select></label>
      <label>Nội dung (công thức viết trong dấu $, ví dụ $\\frac{1}{2}$ hoặc $x^2$)
        <textarea id="content" required></textarea></label>
      <div class="g2">
        <label>Hiện lúc (phút:giây)<input id="time" placeholder="1:30"></label>
        <label>Điểm<input id="points" type="number" min="0.25" step="0.25"></label>
      </div>
      <div id="sec-mcq">
        <p class="small muted">Gõ 4 đáp án và chọn nút tròn bên đáp án đúng.</p>
        ${'ABCD'.split('').map((L, i) => `<label class="opt"><input type="radio" name="mc" value="${L}"><b>${L}.</b>
          <input class="mco" data-i="${i}" placeholder="Đáp án ${L}" style="margin:0"></label>`).join('')}
      </div>
      <div id="sec-tf">
        <label>Kiểu
          <select id="tfmode"><option value="one">Một mệnh đề</option><option value="four">4 ý a, b, c, d</option></select></label>
        <div id="tf-one">
          <label class="opt"><input type="radio" name="tf1" value="true">Đúng</label>
          <label class="opt"><input type="radio" name="tf1" value="false">Sai</label>
        </div>
        <div id="tf-four">
          ${'abcd'.split('').map((c, i) => `<div class="tfrow"><input class="tfo" data-i="${i}" placeholder="Ý ${c}" style="margin:0">
            <span class="tfopts"><label class="opt"><input type="radio" name="tf_${c}" value="true">Đ</label>
            <label class="opt"><input type="radio" name="tf_${c}" value="false">S</label></span></div>`).join('')}
        </div>
      </div>
      <div id="sec-short">
        <label>Đáp án đúng (có nhiều cách viết thì ngăn cách bằng dấu |, ví dụ 0,5 | 1/2)<input id="short"></label>
      </div>
      <label>Giải thích hiện sau khi trả lời (không bắt buộc)<textarea id="expl"></textarea></label>
      <p class="err" id="e"></p>
      <div class="actions">
        <button type="button" class="link" id="fromVideo" ${edPlayer ? '' : 'hidden'}>Lấy thời điểm hiện tại của video</button>
        <button type="button" class="btn ghost" data-close>Hủy</button><button class="btn" id="go">Lưu câu hỏi</button>
      </div>
    </form>`);
  const $f = s => $(s, m.el);
  $f('#type').value = q.type;
  $f('#content').value = q.content;
  $f('#time').value = fmtT(q.show_at_second || 0);
  $f('#points').value = q.points;
  $f('#expl').value = q.explanation || '';
  if (q.type === 'mcq' && Array.isArray(q.options)) $$('.mco', m.el).forEach(i => i.value = q.options[+i.dataset.i] || '');
  if (q.type === 'mcq' && key) { const r = $(`input[name=mc][value="${key}"]`, m.el); if (r) r.checked = true; }
  if (q.type === 'true_false') {
    if (Array.isArray(q.options)) {
      $f('#tfmode').value = 'four';
      $$('.tfo', m.el).forEach(i => i.value = q.options[+i.dataset.i] || '');
      'abcd'.split('').forEach(c => { const r = $(`input[name=tf_${c}][value="${key && key[c] ? 'true' : 'false'}"]`, m.el); if (r) r.checked = true; });
    } else { const r = $(`input[name=tf1][value="${key === true}"]`, m.el); if (r && key !== undefined && key !== null) r.checked = true; }
  }
  if (q.type === 'short') $f('#short').value = Array.isArray(key) ? key.join(' | ') : (key ?? '');
  const sync = () => {
    const t = $f('#type').value, four = $f('#tfmode').value === 'four';
    $f('#sec-mcq').hidden = t !== 'mcq'; $f('#sec-tf').hidden = t !== 'true_false'; $f('#sec-short').hidden = t !== 'short';
    $f('#tf-one').hidden = four; $f('#tf-four').hidden = !four;
  };
  $f('#type').addEventListener('change', sync); $f('#tfmode').addEventListener('change', sync); sync();
  $f('#fromVideo').addEventListener('click', () => { if (edPlayer) $f('#time').value = fmtT(edPlayer.getCurrentTime()); });

  $f('#f').addEventListener('submit', async ev => {
    ev.preventDefault();
    const err = t => { $f('#e').textContent = t; };
    err('');
    const type = $f('#type').value, content = $f('#content').value.trim();
    const t = parseT($f('#time').value), pts = parseFloat($f('#points').value);
    if (!content) return err('Hãy nhập nội dung câu hỏi.');
    if (t === null) return err('Thời điểm không hợp lệ (ví dụ 1:30).');
    if (!(pts > 0)) return err('Điểm phải lớn hơn 0.');
    let options = null, answer;
    if (type === 'mcq') {
      options = $$('.mco', m.el).map(i => i.value.trim());
      if (options.some(o => !o)) return err('Hãy nhập đủ 4 đáp án.');
      const r = $('input[name=mc]:checked', m.el);
      if (!r) return err('Hãy chọn đáp án đúng.');
      answer = r.value;
    } else if (type === 'true_false') {
      if ($f('#tfmode').value === 'four') {
        options = $$('.tfo', m.el).map(i => i.value.trim());
        if (options.some(o => !o)) return err('Hãy nhập đủ 4 ý a, b, c, d.');
        answer = {};
        for (const c of 'abcd') {
          const r = $(`input[name=tf_${c}]:checked`, m.el);
          if (!r) return err(`Hãy chọn Đúng/Sai cho ý ${c}.`);
          answer[c] = r.value === 'true';
        }
      } else {
        const r = $('input[name=tf1]:checked', m.el);
        if (!r) return err('Hãy chọn Đúng hoặc Sai.');
        answer = r.value === 'true';
      }
    } else {
      const arr = $f('#short').value.split('|').map(s => s.trim()).filter(Boolean);
      if (!arr.length) return err('Hãy nhập đáp án đúng.');
      answer = arr.length === 1 ? arr[0] : arr;
    }
    $f('#go').disabled = true;
    const row = { type, content, options, show_at_second: t, points: pts, explanation: $f('#expl').value.trim() || null };
    let qid = q.id;
    if (edit) {
      const { error } = await sb.from('questions').update(row).eq('id', qid);
      if (error) { err(viErr(error.message)); $f('#go').disabled = false; return; }
    } else {
      const { data, error } = await sb.from('questions').insert({ ...row, lesson_id: les.id, position: nextPos }).select().single();
      if (error) { err(viErr(error.message)); $f('#go').disabled = false; return; }
      qid = data.id;
    }
    const { error: ke } = await sb.from('question_keys').upsert({ question_id: qid, correct_answer: answer });
    if (ke) {
      if (!edit) await sb.from('questions').delete().eq('id', qid);
      err(viErr(ke.message)); $f('#go').disabled = false; return;
    }
    m.close(); onDone();
  });
}

async function assignModal(cls, asgList, onDone) {
  const { data } = await sb.from('lessons').select('id, title').order('created_at', { ascending: false });
  const taken = new Set(asgList.map(a => a.lesson_id));

    modal(`<h2>Giao bài</h2><p>Không còn bài học nào để giao. <a href="#/lessons" data-close>Tạo bài học mới</a></p>

  }
  const m = modal(`
    <h2>Giao bài cho ${esc(cls.name)}</h2>
    <form id="f">
      <label>Bài học<select name="lesson">${avail.map(l => `<option value="${l.id}">${esc(l.title)}</option>`).join('')}</select></label>
      <div class="g2">
        <label>Mở từ (tùy chọn)<input type="datetime-local" name="open"></label>
        <label>Hạn nộp (tùy chọn)<input type="datetime-local" name="due"></label>
      </div>

      <div class="actions"><button type="button" class="btn ghost" data-close>Hủy</button><button class="btn" id="go">Giao bài</button></div>
    </form>`);

    m.close(); onDone();
  });
}

   HỌC SINH: HỌC BÀI (video + câu hỏi hiện đúng giây)

function qFormHtml(q) {
  if (q.type === 'mcq')
    return 'ABCD'.split('').map((L, i) => `<label class="opt"><input type="radio" name="a" value="${L}">
      <span><b>${L}.</b> <span class="mathy">${esc(q.options?.[i] ?? '')}</span></span></label>`).join('');
  if (q.type === 'true_false' && Array.isArray(q.options))
    return 'abcd'.split('').map((c, i) => `<div class="tfrow"><span class="mathy"><b>${c})</b> ${esc(q.options[i] ?? '')}</span>
      <span class="tfopts"><label class="opt"><input type="radio" name="tf_${c}" value="true">Đúng</label>
      <label class="opt"><input type="radio" name="tf_${c}" value="false">Sai</label></span></div>`).join('');
  if (q.type === 'true_false')
    return `<label class="opt"><input type="radio" name="a" value="true">Đúng</label><label class="opt"><input type="radio" name="a" value="false">Sai</label>`;
  return `<input id="short" autocomplete="off" placeholder="Nhập đáp án"><p class="small muted">Số thập phân viết dấu phẩy hoặc dấu chấm đều được.</p>`;
}
function readResp(q, root) {
  if (q.type === 'true_false' && Array.isArray(q.options)) {
    const o = {};
    for (const c of 'abcd') { const r = $(`input[name=tf_${c}]:checked`, root); if (!r) return null; o[c] = r.value === 'true'; }
    return o;
  }
  if (q.type === 'short') { const v = $('#short', root).value.trim(); return v || null; }
  const r = $('input[name=a]:checked', root);
  if (!r) return null;
  return q.type === 'true_false' ? r.value === 'true' : r.value;
}

async function learnPage(cid, lid) {
  if (teardown) { try { teardown(); } catch (e) {} teardown = null; }
  shell('home', loading());
  const [{ data: les, error }, { data: qs }] = await Promise.all([
    sb.from('lessons').select('id, title, chapter, description, pdf_url, youtube_id').eq('id', lid).single(),
    sb.from('questions').select('id, type, content, options, show_at_second, points, position').eq('lesson_id', lid)
      .order('show_at_second', { ascending: true }).order('position')
  ]);
  if (error || !les) { $('.main').innerHTML = '<div class="card empty"><h2>Bài học chưa mở hoặc không tồn tại</h2><a href="#/">Quay lại</a></div>'; return; }
  const qlist = qs || [], total = qlist.length;
  const maxPts = qlist.reduce((s, q) => s + Number(q.points), 0);
  const st = { attempt: null, starting: false, answers: {}, shown: null, shownAt: 0, score: 0, finished: false, ended: false };
  const pdf = pdfEmbed(les.pdf_url);

  $('.main').innerHTML = `
    <p class="small"><a href="#/">← Bài học của tôi</a></p>
    <h1>${esc(les.title)}</h1><p class="muted">${esc(les.chapter || '')}</p>
    ${les.youtube_id ? '<div class="video"><div id="yt"></div></div>' : '<div class="card"><p class="muted">Bài này chưa có video.</p></div>'}
    <div class="bar"><span id="prog" class="muted small"></span>
      ${total ? '<button class="btn sm ghost" id="submitAll">Nộp bài</button>' : ''}</div>
    <div id="qbox"></div>
    ${les.description ? `<div class="card" style="margin-bottom:16px"><p class="mathy" style="margin:0">${esc(les.description)}</p></div>` : ''}
    ${pdf ? `<div class="card"><h2>Tài liệu</h2>
      <a class="btn sm ghost" target="_blank" rel="noopener" href="${esc(pdf)}">Mở PDF ở tab mới</a>
      <div class="pdf"><iframe src="${esc(pdf)}" loading="lazy" title="Tài liệu PDF"></iframe></div></div>` : ''}`;
  math($('.main'));

  const qbox = $('#qbox');
  let player = null, iv = null;
  const answeredN = () => Object.keys(st.answers).length;
  const prog = () => {
    $('#prog').textContent = !total ? '' : st.attempt
      ? `Đã trả lời ${answeredN()}/${total} câu · ${st.score}/${maxPts} điểm`
      : `Bài có ${total} câu hỏi hiện trong lúc xem. Bấm phát video để bắt đầu.`;
  };
  prog();

  const logEv = ev => {
    if (!player || !player.getCurrentTime) return;
    sb.from('video_events').insert({ lesson_id: lid, event: ev, video_second: Math.round(player.getCurrentTime()) }).then(() => {}, () => {});
  };
  async function ensureAttempt() {
    if (st.attempt || st.starting || !total) return;
    st.starting = true;
    const { data, error } = await sb.rpc('start_attempt', { p_class: cid, p_lesson: lid });
    st.starting = false;
    if (error) { qbox.innerHTML = `<p class="err">${esc(viErr(error.message))}</p>`; return; }
    st.attempt = data; prog();
  }
  function poll() {
    if (!player || !player.getCurrentTime || st.shown || !st.attempt || st.finished) return;
    const t = player.getCurrentTime();
    const q = qlist.find(x => !st.answers[x.id] && (st.ended || (x.show_at_second != null && x.show_at_second <= t)));
    if (q) showQ(q);
  }
  function showQ(q) {
    st.shown = q; st.shownAt = Date.now();
    try { player.pauseVideo(); } catch (e) {}
    qbox.innerHTML = `<div class="card qcard">
      <span class="tag">Câu ${qlist.indexOf(q) + 1}/${total}</span> <span class="muted small">${esc(q.points)} điểm</span>
      <p class="mathy" style="margin:10px 0 14px">${esc(q.content)}</p>
      <div id="qform">${qFormHtml(q)}</div>
      <p class="err" id="qe"></p>
      <button class="btn" id="qgo">Trả lời</button></div>`;
    math(qbox);
    qbox.scrollIntoView({ behavior: 'smooth', block: 'center' });
    $('#qgo').addEventListener('click', () => submitQ(q));
  }
  async function submitQ(q) {
    const resp = readResp(q, qbox);
    if (resp === null) { $('#qe').textContent = 'Hãy chọn hoặc nhập đáp án trước khi trả lời.'; return; }
    $('#qgo').disabled = true;
    const secs = Math.round((Date.now() - st.shownAt) / 1000);
    const { data, error } = await sb.rpc('submit_answer', { p_attempt: st.attempt, p_question: q.id, p_response: resp, p_time: secs });
    if (error) { $('#qe').textContent = viErr(error.message); $('#qgo').disabled = false; return; }
    st.answers[q.id] = { ok: data.is_correct };
    st.score += Number(data.points || 0);
    prog();
    const allDone = answeredN() === total;
    const last = allDone && st.ended;
    qbox.innerHTML = `<div class="card qcard">
      <div class="fb ${data.is_correct ? 'ok' : 'bad'}">${data.is_correct ? 'Chính xác! +' + esc(data.points) + ' điểm' : 'Chưa đúng.'}</div>
      ${data.explanation ? `<p class="mathy">${esc(data.explanation)}</p>` : ''}
      <div class="actions" style="justify-content:flex-start">
        ${data.is_correct ? '' : '<button class="btn ghost" id="rewind">Xem lại 30 giây trước</button>'}
        <button class="btn" id="next">${last ? 'Nộp bài và xem điểm' : 'Tiếp tục xem'}</button></div></div>`;
    math(qbox);
    $('#rewind')?.addEventListener('click', () => {
      st.shown = null; qbox.innerHTML = '';
      player.seekTo(Math.max(0, (q.show_at_second || 0) - 30), true); player.playVideo(); logEv('replay');
    });
    $('#next').addEventListener('click', () => {
      st.shown = null; qbox.innerHTML = '';
      if (last) return finish(true);
      if (!st.ended) player.playVideo();
    });
  }
  async function finish(skipConfirm) {
    if (st.finished) return;
    if (!st.attempt) { alert('Hãy xem video và trả lời câu hỏi trước khi nộp bài.'); return; }
    const left = total - answeredN();
    if (!skipConfirm && left > 0 && !confirm(`Còn ${left} câu chưa trả lời (tính 0 điểm). Vẫn nộp bài?`)) return;
    try { player.pauseVideo(); } catch (e) {}
    const { data, error } = await sb.rpc('finish_attempt', { p_attempt: st.attempt });
    if (error) { qbox.innerHTML = `<p class="err">${esc(viErr(error.message))}</p>`; return; }
    st.finished = true; st.shown = null;
    const correct = Object.values(st.answers).filter(a => a.ok).length;
    qbox.innerHTML = `<div class="card qcard"><h2>Kết quả</h2>
      <p style="font-size:28px;margin:0 0 6px"><b>${esc(data.score)}</b> / ${esc(data.max_score)} điểm</p>
      <p class="muted">Đúng ${correct}/${total} câu.</p>
      <div class="actions" style="justify-content:flex-start"><button class="btn ghost" id="again">Học lại</button>
        <a class="btn" href="#/">Về danh sách bài</a></div></div>`;
    $('#again').addEventListener('click', () => learnPage(cid, lid));
    qbox.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  $('#submitAll')?.addEventListener('click', () => finish(false));

  if (les.youtube_id) {
    makePlayer('yt', les.youtube_id, s => {
      if (s === 1) {
        if (st.shown) { try { player.pauseVideo(); } catch (e) {} return; }   // đang có câu hỏi: không cho tua qua
        st.ended = false; ensureAttempt(); logEv('play');
      } else if (s === 2) logEv('pause');
      else if (s === 0) {
        st.ended = true; logEv('end');
        ensureAttempt().then(() => { poll(); if (!st.shown && st.attempt && answeredN() === total) finish(true); });
      }
    }).then(p => { player = p; iv = setInterval(poll, 300); }).catch(() => {});
  }
  teardown = () => { clearInterval(iv); try { player && player.destroy(); } catch (e) {} };
}
</script>
</body>
</html>
